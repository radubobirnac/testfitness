<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppeteer MCP Server Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        h1 {
            color: #1a365d;
        }
        button {
            background-color: #4299e1;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        #result {
            margin-top: 1rem;
            padding: 1rem;
            background-color: #f7fafc;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Puppeteer MCP Server Test</h1>
        <p>This page demonstrates the capabilities of the Puppeteer MCP server. Click the button below to execute a JavaScript function.</p>
        
        <button id="testButton">Click Me!</button>
        
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('testButton').addEventListener('click', function() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Button clicked at: ' + new Date().toLocaleTimeString();
            
            console.log('Button clicked!');
        });

        console.log('Page loaded successfully');
    </script>
</body>
</html>
