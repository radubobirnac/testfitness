name: Build release APK

# Builds a release APK signed with the same key as local builds, so it
# installs as an update over the app on your phone (data is kept).
#
# One-time setup — repository Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64    the .jks keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  storePassword from android/key.properties
#   ANDROID_KEY_ALIAS          keyAlias from android/key.properties
#   ANDROID_KEY_PASSWORD       keyPassword from android/key.properties
#
# Run it from the Actions tab ("Run workflow"); the APK is attached to the
# run as an artifact named StrengthWave-<version>-build<number>.

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/build-apk.yml']

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9  # newest that accepts the project's Gradle 8.10 / AGP 8.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Set up release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Name the APK
        id: apk
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          name="StrengthWave-${version%%+*}-build${version##*+}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Signing certificate (compare with your 1.6.0 build):"
          keytool -printcert -jarfile "dist/$name.apk" | grep -E 'Owner|SHA256' || true

      - name: Upload APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}.apk
          retention-days: 30
          if-no-files-found: error

      - name: Signing secrets missing
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::The build works, but no APK was uploaded: the signing secrets are not set."
          echo "Without them the APK is debug-signed and will not install over your current app."
          echo "Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and"
          echo "ANDROID_KEY_PASSWORD under Settings > Secrets and variables > Actions, then re-run."
          exit 1

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"
